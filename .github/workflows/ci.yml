name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Syntaxe et métadonnées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Le userscript n'a ni build ni dépendance : la syntaxe est tout ce qu'une
      # analyse statique peut garantir sans navigateur.
      - name: Vérifier la syntaxe
        run: node --check vsa-cra-helper.user.js

      - name: Vérifier l'en-tête ==UserScript== et la version
        run: node scripts/validate.mjs
